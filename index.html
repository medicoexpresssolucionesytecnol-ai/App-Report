<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Personal</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control Personal">
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .frame-box {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f1f5f9;
    }
    .frame-box iframe {
      position: absolute;
      top: 18px; /* Sube o baja el panel: usa 24px para más espacio arriba o 10px para menos */
      left: 0;
      width: 100%;
      height: calc(100% - 18px);
      border: 0;
      background-color: transparent;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #ffffff;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loading">Cargando...</div>
  <div class="frame-box">
    <iframe
      src="https://script.google.com/macros/s/AKfycbyiYqV_SLz2-6V8GAaUSCGb_Nj9m0T0nAUwMnnuuV-9M1GDpbuImbZo14P7D-uvSmnb/exec"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
      sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-modals"
      onload="document.getElementById('loading').style.display='none';">
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.log('Service Worker no registrado:', err);
      });
    }
  </script>
</body>
</html>
